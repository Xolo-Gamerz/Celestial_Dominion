name: Client Smoke Test

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            jdks

      - name: Cache Minecraft client assets
        uses: actions/cache@v4
        with:
          path: run/assets
          key: minecraft-assets-${{ runner.os }}-${{ hashFiles('gradle.properties') }}

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate assets
        run: |
          python scripts/generate_textures.py
          python scripts/generate_relic_assets.py
          python scripts/test_assets.py
          python scripts/check_client_model_bake.py --self-test

      - name: Install headless Vulkan runtime
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends xvfb mesa-vulkan-drivers

      - name: Smoke-test client resource loading
        shell: bash
        env:
          SDL_VIDEO_DRIVER: x11
        run: |
          set -euo pipefail

          VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d /etc/vulkan/icd.d \
            -maxdepth 1 -type f \( -iname '*lvp*.json' -o -iname '*lavapipe*.json' \) \
            -print -quit 2>/dev/null || true)"
          if [ -z "$VK_ICD_FILENAMES" ]; then
            echo "Lavapipe Vulkan ICD missing"
            find /usr/share/vulkan/icd.d /etc/vulkan/icd.d -maxdepth 1 -type f -print 2>/dev/null || true
            exit 1
          fi
          export VK_ICD_FILENAMES
          mkdir -p run/config
          if [ -f run/config/fml.toml ]; then
            if grep -qE '^[[:space:]]*earlyWindowControl[[:space:]]*=' run/config/fml.toml; then
              sed -i -E 's/^[[:space:]]*earlyWindowControl[[:space:]]*=.*/earlyWindowControl = false/' run/config/fml.toml
            else
              printf '\nearlyWindowControl = false\n' >> run/config/fml.toml
            fi
          else
            printf 'earlyWindowControl = false\n' > run/config/fml.toml
          fi

          LOG=run/logs/latest.log
          SMOKE="$RUNNER_TEMP/client-smoke.log"
          rm -f "$LOG" "$SMOKE"
          timeout --signal=TERM --kill-after=10s 240s \
            xvfb-run -a -s "-screen 0 854x480x24 +extension GLX +render" \
            ./gradlew runClient --console=plain > "$SMOKE" 2>&1 &
          PID=$!

          fail() {
            echo "::error::$1"
            tail -n 160 "$SMOKE" || true
            tail -n 160 "$LOG" 2>/dev/null || true
            kill "$PID" 2>/dev/null || true
            exit 1
          }

          deadline=$((SECONDS + 190))
          reload_seen=0
          while (( SECONDS < deadline )); do
            if grep -q "Reloading ResourceManager" "$LOG" 2>/dev/null; then
              reload_seen=1
              break
            fi
            if grep -Eiq "Vulkan is not supported|Failed to create backend Vulkan|Failed to create Vulkan (instance|device)|No Vulkan devices" "$LOG" "$SMOKE" 2>/dev/null; then
              fail "Minecraft Vulkan graphics backend failed."
            fi
            kill -0 "$PID" 2>/dev/null || break
            sleep 2
          done
          [ "$reload_seen" -eq 1 ] || fail "Client exited or timed out before resource reload."

          # Wait for the number of created atlases to stop changing. Do not
          # use total log-file size: unrelated sound/narrator warnings can keep
          # appending to latest.log after every atlas has loaded.
          atlas_deadline=$((SECONDS + 60))
          last_atlas_count=0
          stable_samples=0
          while (( SECONDS < atlas_deadline )); do
            atlas_count="$(grep -c "TextureAtlas.*Created:" "$LOG" 2>/dev/null || true)"
            if (( atlas_count > 0 )); then
              if [ "$atlas_count" = "$last_atlas_count" ]; then
                stable_samples=$((stable_samples + 1))
              else
                stable_samples=0
                last_atlas_count="$atlas_count"
              fi
              (( stable_samples >= 3 )) && break
            fi
            sleep 2
          done
          (( stable_samples >= 3 )) || fail "Texture-atlas creation did not complete (last observed count: $last_atlas_count)."
          grep -Eq "Using graphics backend (Vulkan|OpenGL)" "$LOG" || fail "Minecraft did not initialize a graphics backend."

          pkill -TERM -f '[n]et.neoforged.devlaunch.Main' || fail "NeoForge client process not found for shutdown."
          set +e
          wait "$PID"
          status=$?
          set -e
          cat "$SMOKE"
          [ "$status" -eq 143 ] || fail "Expected controlled SIGTERM exit 143; got $status."
          python scripts/check_client_model_bake.py "$LOG"

      - name: Upload client logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celestial-dominion-client-logs
          path: |
            run/logs/latest.log
            ${{ runner.temp }}/client-smoke.log
          if-no-files-found: warn
          retention-days: 14
