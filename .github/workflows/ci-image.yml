name: Publish CI Runtime Image

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/ci-image.yml"
      - "Dockerfile.ci"
  pull_request:
    paths:
      - ".github/workflows/ci-image.yml"
      - "Dockerfile.ci"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          push: true
          tags: |
            ghcr.io/xolo-gamerz/celestial-dominion-ci:ubuntu24.04
            ghcr.io/xolo-gamerz/celestial-dominion-ci:${{ github.sha }}
          cache-from: type=gha,scope=ci-runtime
          cache-to: type=gha,mode=max,scope=ci-runtime

      - name: Make GHCR image public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            /user/packages/container/celestial-dominion-ci/visibility \
            -f visibility=public
