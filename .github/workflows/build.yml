name: Build Celestial Dominion

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Generate item icons and armor atlases
        run: python scripts/generate_textures.py

      - name: Generate 3D relic models and animated textures
        run: python scripts/generate_relic_assets.py

      - name: Validate generated assets
        run: python scripts/test_assets.py

      - name: Build mod
        run: ./gradlew build

      # A normal Gradle build does not bake client item models. Launch a real
      # NeoForge client under a virtual X server and inspect its resource reload
      # log so bad cuboid UVs are caught before the artifact is published.
      - name: Install headless graphics runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Smoke-test client model baking
        shell: bash
        run: |
          set +e
          timeout --signal=TERM 240s xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "NeoForge client failed before the smoke-test timeout (exit $status)"
            exit "$status"
          fi
          python scripts/check_client_model_bake.py run/logs/latest.log

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: celestial-dominion-minecraft-26.3
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
