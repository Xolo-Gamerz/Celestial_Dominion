name: Build Celestial Dominion

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Install asset generator dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate assets
        run: |
          python scripts/generate_textures.py
          python scripts/generate_relic_assets.py

      - name: Validate assets
        run: python scripts/test_assets.py

      - name: Test client-log checker
        run: python scripts/check_client_model_bake.py --self-test

      - name: Build mod
        run: ./gradlew build --console=plain -Pneogradle.subsystems.decompiler.enabled=false

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: celestial-dominion-minecraft-26.3
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
