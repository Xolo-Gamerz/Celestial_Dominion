name: Build Celestial Dominion

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pin the runner image so Mesa/Xvfb behavior does not drift with ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Cache dependencies, transformed Minecraft/NeoForge artifacts, and the
      # 465 MiB vanilla asset set used by runClient.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
          # Same-repository PRs can refresh their own merge-ref cache; fork PRs
          # stay read-only and cannot write cache entries.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Generate item icons and armor atlases
        run: python scripts/generate_textures.py

      - name: Generate 3D relic models and animated textures
        run: python scripts/generate_relic_assets.py

      - name: Validate generated assets
        run: python scripts/test_assets.py

      - name: Build mod
        run: ./gradlew build --no-daemon

      # Minecraft 26.3 requests an sRGB GLX framebuffer that llvmpipe/Xvfb
      # does not expose. Use Mesa's software Vulkan driver instead. NeoForge's
      # early loading window must also be disabled in this headless session.
      - name: Install headless Vulkan runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers vulkan-tools

      - name: Smoke-test client model baking
        shell: bash
        env:
          SDL_VIDEO_DRIVER: x11
        run: |
          set -euo pipefail

          # Ubuntu/Mesa package versions do not keep the Lavapipe ICD filename
          # stable. Discover it instead of assuming one distro-specific path.
          VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d /etc/vulkan/icd.d \
            -maxdepth 1 -type f \( -iname '*lvp*.json' -o -iname '*lavapipe*.json' \) \
            -print -quit 2>/dev/null || true)"
          if [ -z "$VK_ICD_FILENAMES" ]; then
            echo "Lavapipe Vulkan ICD was not installed. Available ICD manifests:"
            find /usr/share/vulkan/icd.d /etc/vulkan/icd.d -maxdepth 1 -type f -print 2>/dev/null || true
            exit 1
          fi
          export VK_ICD_FILENAMES
          echo "Using Vulkan ICD: $VK_ICD_FILENAMES"

          mkdir -p run/config
          if [ -f run/config/fml.toml ]; then
            if grep -qE '^[[:space:]]*earlyWindowControl[[:space:]]*=' run/config/fml.toml; then
              sed -i -E 's/^[[:space:]]*earlyWindowControl[[:space:]]*=.*/earlyWindowControl = false/' run/config/fml.toml
            else
              printf '\nearlyWindowControl = false\n' >> run/config/fml.toml
            fi
          else
            printf 'earlyWindowControl = false\n' > run/config/fml.toml
          fi

          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a -s "-screen 0 854x480x24 +extension GLX +render" bash -lc '
            set -e
            vulkaninfo --summary
            ./gradlew runClient --no-daemon
          ' > "$RUNNER_TEMP/client-smoke.log" 2>&1 &
          smoke_pid=$!

          deadline=$((SECONDS + 125))
          reload_seen=0
          while (( SECONDS < deadline )); do
            if grep -q "Reloading ResourceManager" run/logs/latest.log 2>/dev/null; then
              # Give asynchronous model baking/resource reload callbacks time
              # to finish, then stop the interactive client instead of burning
              # the rest of the timeout waiting for a user to close it.
              sleep 15
              reload_seen=1
              break
            fi

            if grep -Eq "Failed to create backend|Vulkan is not supported|Couldn't find matching GLX visual" run/logs/latest.log 2>/dev/null; then
              echo "Minecraft graphics backend failed before resource reload:"
              tail -n 100 run/logs/latest.log
              pkill -TERM -f '[n]et.neoforged.devlaunch.Main' || true
              kill "$smoke_pid" 2>/dev/null || true
              wait "$smoke_pid" || true
              exit 1
            fi

            if ! kill -0 "$smoke_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          if [ "$reload_seen" -eq 1 ]; then
            pkill -TERM -f '[n]et.neoforged.devlaunch.Main' || true
          else
            echo "Client did not reach resource reload within 120 seconds."
            tail -n 120 "$RUNNER_TEMP/client-smoke.log"
            kill "$smoke_pid" 2>/dev/null || true
            wait "$smoke_pid" || true
            exit 1
          fi

          wait "$smoke_pid" || true
          cat "$RUNNER_TEMP/client-smoke.log"
          python scripts/check_client_model_bake.py run/logs/latest.log

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: celestial-dominion-minecraft-26.3
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
