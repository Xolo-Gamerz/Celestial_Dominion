name: Build Celestial Dominion

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Generate item icons and armor atlases
        run: python scripts/generate_textures.py

      - name: Generate 3D relic models and animated textures
        run: python scripts/generate_relic_assets.py

      - name: Validate generated assets
        run: python scripts/test_assets.py

      - name: Build mod
        run: ./gradlew build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: celestial-dominion-minecraft-26.3
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
